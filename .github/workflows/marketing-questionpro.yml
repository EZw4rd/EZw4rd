name: Marketing QuestionPro

on:
  workflow_dispatch:
    inputs:
      skill:
        description: "Marketing skill to run"
        required: true
        type: choice
        options:
          - copywriting
          - copy-editing
          - content-strategy
          - social-content
          - seo-audit
          - programmatic-seo
          - schema-markup
          - page-cro
          - form-cro
          - popup-cro
          - signup-flow-cro
          - onboarding-cro
          - paywall-upgrade-cro
          - marketing-ideas
          - marketing-psychology
          - pricing-strategy
          - launch-strategy
          - free-tool-strategy
          - competitor-alternatives
          - product-marketing-context
          - email-sequence
          - paid-ads
          - referral-program
          - ab-test-setup
          - analytics-tracking

jobs:
  marketing:
    name: Marketing QuestionPro
    runs-on: ubuntu-latest
    environment: Marketing QuestionPro
    steps:
      - uses: actions/checkout@v4

      - name: Load skill
        run: |
          echo "Running marketing skill: ${{ inputs.skill }}"
          echo "Environment: Marketing QuestionPro"
          cat .agents/skills/${{ inputs.skill }}/SKILL.md
